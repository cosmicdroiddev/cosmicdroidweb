# Netlify: the website is the site/ folder, as is (no build step).
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# the two Terp Wizard pages became one
[[redirects]]
  from = "/projects/terp-wizard-lab.html"
  to = "/projects/terp-wizard.html"
  status = 301

# the Murals page was removed; old links go to Works (murals are a filter there)
[[redirects]]
  from = "/murals.html"
  to = "/work.html"
  status = 301
