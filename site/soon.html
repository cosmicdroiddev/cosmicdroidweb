<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cosmicdroid · new site in progress</title>
<meta name="description" content="Illustrator, animator and muralist based in Colombia. A new site is on the way.">
<meta property="og:title" content="cosmicdroid">
<meta property="og:description" content="Illustrator, animator and muralist based in Colombia. A new site is on the way.">
<meta name="theme-color" content="#dce9fb">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,125,900&family=Space+Mono:wght@400;700&display=swap">
<!-- "Coming soon" page. netlify.toml shows it at cosmicdroid.com/ until the real site launches.
     It uses absolute paths (/assets/...) because it is also served for old WordPress links like /portfolio/x. -->
<style>
  :root {
    --paper: #dce9fb;
    --panel: #fbf9ea;
    --line: #3326d6;
    --ink: #2a1fb0;
    --muted: #5650b8;
    --violet: #7a3cf2;
    --logo: #b377ff;
    --lime: #e6f43c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Space Mono", ui-monospace, monospace;
    background:
      linear-gradient(rgba(51, 38, 214, 0.12) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(51, 38, 214, 0.12) 1px, transparent 1px) 0 0 / 48px 48px,
      var(--paper);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .card {
    width: min(640px, 100%);
    background: var(--panel);
    border: 2px solid var(--line);
    box-shadow: 8px 8px 0 var(--line);
  }
  .bar {
    display: flex;
    align-items: stretch;
    border-bottom: 2px solid var(--line);
  }
  .bar .icon {
    width: 64px;
    flex: none;
    background: var(--logo);
    border-right: 2px solid var(--line);
    display: grid;
    place-items: center;
  }
  .bar .icon img { width: 48px; height: 48px; object-fit: contain; }
  .bar .word {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 10px 16px;
  }
  .bar .word img { height: 40px; max-width: 100%; object-fit: contain; }

  .stage {
    position: relative;
    height: 150px;
    overflow: hidden;
    border-bottom: 2px solid var(--line);
  }
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 28px;
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--line) 0 18px, transparent 18px 30px);
  }
  .walker {
    position: absolute;
    left: 0;
    bottom: 22px;
    width: 104px;
    height: 104px;
  }
  .frog {
    display: block;
    width: 100%;
    height: 100%;
    background: url(/assets/castle/hero-sheet.png) 0 0 / 800% 100% no-repeat;
    background-position-x: 28.5714%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .ground { animation: ground 0.44s linear infinite; }
    .frog { animation: run 0.44s steps(4) infinite; }
    /* walk right, turn around, walk back */
    .walker { animation: patrol 9s linear infinite; }
  }
  @media (prefers-reduced-motion: reduce) {
    .walker { left: calc(50% - 52px); }
  }
  @keyframes run { from { background-position-x: 28.5714%; } to { background-position-x: 85.7143%; } }
  @keyframes ground { to { background-position-x: -30px; } }
  @keyframes patrol {
    0%      { transform: translateX(-110px) scaleX(1); }
    49.99%  { transform: translateX(calc(min(640px, 100vw - 32px) + 6px)) scaleX(1); }
    50%     { transform: translateX(calc(min(640px, 100vw - 32px) + 6px)) scaleX(-1); }
    99.99%  { transform: translateX(-110px) scaleX(-1); }
    100%    { transform: translateX(-110px) scaleX(1); }
  }

  .copy { padding: 22px 24px 26px; }
  .tag {
    display: inline-block;
    margin: 0 0 12px;
    padding: 3px 10px;
    background: var(--violet);
    color: var(--lime);
    font: italic 900 0.8rem/1.4 "Archivo", sans-serif;
    font-stretch: 125%;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 10px;
    font: italic 900 clamp(1.7rem, 6vw, 2.6rem)/1.02 "Archivo", sans-serif;
    font-stretch: 125%;
    text-transform: uppercase;
    color: var(--line);
  }
  p { margin: 0 0 18px; font-size: 0.95rem; line-height: 1.6; color: var(--muted); }
  .dots::after { content: "..."; display: inline-block; width: 3ch; text-align: left; overflow: hidden; vertical-align: bottom; }
  @media (prefers-reduced-motion: no-preference) {
    .dots::after { animation: dots 1.2s steps(4) infinite; }
  }
  @keyframes dots { from { width: 0; } to { width: 4ch; } }

  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border: 2px solid var(--line);
    background: var(--paper);
    color: var(--line);
    font: 700 0.85rem/1 "Space Mono", monospace;
    text-decoration: none;
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .links a:hover, .links a:focus-visible {
    background: var(--lime);
    transform: translate(-2px, -2px);
    box-shadow: 3px 3px 0 var(--line);
  }
  .links svg { width: 18px; height: 18px; }

  @media (max-width: 480px) {
    .bar .icon { width: 56px; }
    .bar .icon img { width: 40px; height: 40px; }
    .bar .word img { height: 30px; }
    .stage { height: 130px; }
    .walker { width: 88px; height: 88px; }
    .copy { padding: 18px 18px 22px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="bar">
      <span class="icon"><img src="/assets/img/logo-icon.png" alt=""></span>
      <span class="word"><img src="/assets/img/logo-wordmark.png" alt="cosmicdroid"></span>
    </div>

    <div class="stage" aria-hidden="true">
      <span class="ground"></span>
      <span class="walker"><span class="frog"></span></span>
    </div>

    <div class="copy">
      <span class="tag">Web in progress</span>
      <h1>New castle under construction<span class="dots"></span></h1>
      <p>I'm building a brand new home for my murals, characters and comics. Come back soon. Meanwhile you can find me here:</p>
      <div class="links">
        <a href="https://www.instagram.com/cosmicdroid/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          @cosmicdroid
        </a>
        <a href="mailto:cosmicdroidworld@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg>
          cosmicdroidworld@gmail.com
        </a>
      </div>
    </div>
  </main>
</body>
</html>
